<section class="workbench-resin" aria-labelledby="workbench-table-title">
  <div class="container workbench-resin-layout" data-scene="table">
    <div class="workbench-table-visual">
      <img class="scene-poster" src="/assets/river-table-960.webp" width="960" height="640" loading="lazy" alt="Wizualizacja stołu River Table z orzecha, turkusowej żywicy i stalowych nóg">
      <canvas aria-hidden="true"></canvas>
    </div>
    <div class="workbench-table-copy">
      <h2 id="workbench-table-title">Stół River Table w 3D</h2>
      <p>Orzech, naturalna krawędź i żywica epoksydowa. Obejrzyj przykładowy stół, wybierz kolor i sprawdź efekt podświetlenia od spodu.</p>
      <div class="scene-action">
        <fieldset class="workbench-options">
          <legend>Kolor żywicy</legend>
          <button type="button" data-resin="#12ced4" aria-pressed="true"><i style="--swatch:#12ced4"></i>Turkusowy ocean</button>
          <button type="button" data-resin="#e99628" aria-pressed="false"><i style="--swatch:#e99628"></i>Głęboki bursztyn</button>
          <button type="button" data-resin="#1cb477" aria-pressed="false"><i style="--swatch:#1cb477"></i>Szmaragd</button>
          <button type="button" data-resin="#4c5362" aria-pressed="false"><i style="--swatch:#708096"></i>Dymiony grafit</button>
        </fieldset>
        <div class="workbench-view-controls" aria-label="Sterowanie podglądem">
          <button type="button" class="workbench-control" data-led aria-pressed="false">Podświetlenie LED</button>
          <button type="button" class="workbench-control" data-orbit="-.52" aria-label="Obróć widok w lewo">←</button>
          <button type="button" class="workbench-control" data-orbit=".52" aria-label="Obróć widok w prawo">→</button>
          <button type="button" class="workbench-control" data-orbit="closer" aria-label="Przybliż widok">+</button>
          <button type="button" class="workbench-control" data-orbit="farther" aria-label="Oddal widok">−</button>
          <button type="button" class="workbench-control" data-orbit="reset">Widok startowy</button>
        </div>
      </div>
      <p class="workbench-3d-error">Podgląd 3D jest niedostępny w tej przeglądarce.</p>
      <a href="/kontakt/#formularz" class="workbench-link">Zapytaj o stół na wymiar <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>
