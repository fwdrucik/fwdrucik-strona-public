<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
  Ilustracje kategorii sklepu.

  To rysunki, nie zdjecia — i maja tak wygladac. Zdjecie sugeruje konkretny
  egzemplarz na sprzedaz; przy wyrobach recznych, gdzie kazdy jest inny,
  bylby to falszywy sygnal. Ilustracja mowi "taka robota", a nie "ta sztuka".

  Jeden jezyk graficzny dla calego zestawu: material w stali, swiatlo krawedzi
  w cyjanie, a punkt, w ktorym cos sie faktycznie dzieje — lek, dysza, luk,
  frez — na pomaranczowo. Kazda kategoria to proces, nie przedmiot.
-->
<defs>

<!-- ŻYWICA EPOKSYDOWA: przekroj blatu, rzeka zywicy miedzy dwoma kawalkami drewna -->
<symbol id="kat-zywica" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#14171C"/>
  <g opacity=".5" stroke="#2A2F38" stroke-width="1">
    <path d="M0 150h320M0 120h320M0 90h320"/>
  </g>
  <!-- lewy kawalek drewna -->
  <path d="M24 96 L118 92 L126 148 L24 152 Z" fill="#3A3129"/>
  <g stroke="#544537" stroke-width="1.6" fill="none" opacity=".9">
    <path d="M30 104 C60 101 92 103 120 100"/>
    <path d="M30 118 C64 114 96 118 122 114"/>
    <path d="M30 132 C58 130 94 132 124 128"/>
    <path d="M30 144 C62 142 96 144 125 140"/>
  </g>
  <!-- prawy kawalek drewna -->
  <path d="M194 92 L296 96 L296 152 L186 148 Z" fill="#3A3129"/>
  <g stroke="#544537" stroke-width="1.6" fill="none" opacity=".9">
    <path d="M192 102 C222 99 258 101 290 104"/>
    <path d="M190 116 C224 113 256 117 290 118"/>
    <path d="M190 130 C220 128 258 130 290 132"/>
    <path d="M190 142 C222 140 256 142 290 144"/>
  </g>
  <!-- rzeka zywicy -->
  <path d="M118 92 L194 92 L186 148 L126 148 Z" fill="#12506B"/>
  <path d="M126 96 L186 96 L180 144 L132 144 Z" fill="#1A7FA8" opacity=".85"/>
  <path d="M136 100 L176 100 L170 140 L142 140 Z" fill="#2EC2FF" opacity=".55"/>
  <path d="M148 104 L166 104 L160 136 L152 136 Z" fill="#8FE3FF" opacity=".45"/>
  <!-- strumien zalewania -->
  <path d="M156 20 L164 20 L162 88 L157 88 Z" fill="#FF8A3D" opacity=".9"/>
  <ellipse cx="159.5" cy="88" rx="12" ry="4" fill="#FF8A3D" opacity=".5"/>
  <circle cx="160" cy="18" r="7" fill="#FF8A3D"/>
  <!-- swiatlo krawedzi blatu -->
  <path d="M24 96 L118 92 M194 92 L296 96" stroke="#2EC2FF" stroke-width="2" fill="none" opacity=".7"/>
</symbol>

<!-- DRUK 3D: dysza budujaca warstwe po warstwie -->
<symbol id="kat-druk3d" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#14171C"/>
  <!-- stol roboczy -->
  <rect x="40" y="156" width="240" height="10" fill="#20252C"/>
  <path d="M40 156h240" stroke="#2EC2FF" stroke-width="2" opacity=".6"/>
  <!-- warstwy gotowe -->
  <g fill="#8A94A3">
    <rect x="106" y="146" width="108" height="10" rx="1"/>
    <rect x="110" y="134" width="100" height="10" rx="1"/>
    <rect x="114" y="122" width="92" height="10" rx="1"/>
    <rect x="118" y="110" width="84" height="10" rx="1" fill="#9FA9B8"/>
    <rect x="124" y="98" width="72" height="10" rx="1" fill="#B4BDC9"/>
  </g>
  <!-- warstwa wlasnie ukladana -->
  <rect x="130" y="86" width="46" height="10" rx="1" fill="#FF8A3D" opacity=".85"/>
  <!-- glowica -->
  <path d="M168 40 h44 v30 h-16 l-6 12 -6 -12 h-16 z" fill="#20252C" stroke="#2EC2FF" stroke-width="1.8"/>
  <path d="M184 82 l6 -12 h-12 z" fill="#FF8A3D"/>
  <!-- prowadnica -->
  <rect x="40" y="34" width="240" height="6" fill="#2A2F38"/>
  <path d="M40 34h240" stroke="#2EC2FF" stroke-width="1.5" opacity=".4"/>
  <!-- filament -->
  <path d="M240 40 C242 56 220 52 214 46" stroke="#2EC2FF" stroke-width="2.5" fill="none" opacity=".7"/>
</symbol>

<!-- SPAWANIE: luk elektryczny w zlaczu dwoch blach -->
<symbol id="kat-spawanie" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#14171C"/>
  <!-- blachy -->
  <path d="M16 120 L150 108 L150 150 L16 158 Z" fill="#5A6472"/>
  <path d="M170 108 L304 120 L304 158 L170 150 Z" fill="#5A6472"/>
  <path d="M16 120 L150 108 M170 108 L304 120" stroke="#B4BDC9" stroke-width="2" fill="none"/>
  <!-- spoina -->
  <g fill="#8A94A3">
    <circle cx="152" cy="112" r="7"/><circle cx="160" cy="111" r="8"/><circle cx="168" cy="112" r="7"/>
  </g>
  <!-- luk -->
  <circle cx="160" cy="108" r="30" fill="#FF8A3D" opacity=".18"/>
  <circle cx="160" cy="108" r="17" fill="#FF8A3D" opacity=".38"/>
  <circle cx="160" cy="108" r="8" fill="#FFD54F"/>
  <!-- iskry -->
  <g stroke="#FF8A3D" stroke-width="2.5" stroke-linecap="round" opacity=".85">
    <path d="M186 96 l16 -12"/><path d="M196 116 l20 6"/><path d="M134 96 l-16 -12"/>
    <path d="M124 118 l-20 8"/><path d="M160 82 l4 -18"/><path d="M180 130 l14 12"/>
    <path d="M140 130 l-12 14"/>
  </g>
  <!-- uchwyt elektrody -->
  <path d="M212 22 L248 40 L232 66 L198 46 Z" fill="#20252C" stroke="#2EC2FF" stroke-width="1.8"/>
  <path d="M198 46 L162 100" stroke="#B4BDC9" stroke-width="5" stroke-linecap="round"/>
  <path d="M172 88 L162 100" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round"/>
</symbol>

<!-- CNC: frez wybierajacy sciezke w plycie -->
<symbol id="kat-cnc" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#14171C"/>
  <!-- plyta -->
  <rect x="28" y="88" width="264" height="82" rx="3" fill="#5A6472"/>
  <rect x="28" y="88" width="264" height="6" fill="#B4BDC9" opacity=".8"/>
  <!-- sciezka narzedzia -->
  <path d="M56 148 H120 V118 H184 V148 H248" fill="none" stroke="#1A2028" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 148 H120 V118 H184 V148 H248" fill="none" stroke="#2EC2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <!-- wrzeciono -->
  <rect x="228" y="18" width="40" height="52" rx="4" fill="#20252C" stroke="#2EC2FF" stroke-width="1.8"/>
  <rect x="240" y="70" width="16" height="26" fill="#8A94A3"/>
  <!-- frez -->
  <path d="M241 96 h14 v34 l-7 8 -7 -8 z" fill="#B4BDC9"/>
  <g stroke="#5A6472" stroke-width="1.6">
    <path d="M241 104 h14M241 112 h14M241 120 h14"/>
  </g>
  <!-- punkt skrawania -->
  <circle cx="248" cy="140" r="13" fill="#FF8A3D" opacity=".25"/>
  <circle cx="248" cy="138" r="5" fill="#FF8A3D"/>
  <!-- wiory -->
  <g fill="#FF8A3D" opacity=".8">
    <path d="M266 122 q8 -6 4 -14 q10 6 6 16 z"/>
    <path d="M276 146 q10 -2 12 -11 q6 11 -4 17 z"/>
    <path d="M262 158 q9 3 15 -3 q-2 12 -14 11 z"/>
  </g>
</symbol>

<!-- INNE: skrzynka narzedziowa jako neutralny domyslny rysunek -->
<symbol id="kat-inne" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#14171C"/>
  <rect x="72" y="86" width="176" height="82" rx="4" fill="#5A6472"/>
  <rect x="72" y="86" width="176" height="8" fill="#B4BDC9" opacity=".8"/>
  <rect x="72" y="118" width="176" height="10" fill="#1A2028"/>
  <path d="M124 62 h72 v24 h-14 v-10 h-44 v10 h-14 z" fill="#FF8A3D"/>
  <rect x="146" y="52" width="28" height="12" rx="4" fill="#8A94A3"/>
  <path d="M72 86h176" stroke="#2EC2FF" stroke-width="2" opacity=".5"/>
</symbol>

</defs>
</svg>
