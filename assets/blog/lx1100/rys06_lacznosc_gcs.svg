eństwo łącza</text><text x="60.00" y="640.00" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1c2430" text-anchor="start" font-weight="400" dominant-baseline="middle">Sterujesz padem przez MAVLink, a nie klasycznym odbiornikiem RC. Utrata łącza = utrata sterowania, dlatego FS_GCS_ENABLE = 1 (powrót RTL)</text><text x="60.00" y="664.00" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1c2430" text-anchor="start" font-weight="400" dominant-baseline="middle">jest obowiązkowe. Zalecany zapasowy odbiornik RC (S.BUS z jednostki HM30 lub osobny) z RC failsafe → RTL.</text><text x="60.00" y="692.00" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#4a5260" text-anchor="start" font-weight="400" dominant-baseline="middle">Adres .20 koliduje tylko z kontrolerem SIYI MK15; z HM30 i laptopem jest wolny.</text></svg>