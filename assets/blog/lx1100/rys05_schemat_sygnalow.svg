ine="middle">MAIN 1–8: biały sygnał + niebieska masa odniesienia (bez +5 V)</text><text x="850.00" y="950.00" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#4a5260" text-anchor="middle" font-weight="400" dominant-baseline="middle">DShot600: MOT_PWM_TYPE = 6 i BRD_IO_DSHOT = 1 (wyjścia MAIN przez koprocesor IO), tylko gdy firmware ESC obsługuje DShot.</text><text x="850.00" y="972.00" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#4a5260" text-anchor="middle" font-weight="400" dominant-baseline="middle">Bez DShot: MOT_PWM_TYPE = 0 (PWM) i kalibracja zakresu gazu ESC. Kolejność ESC = numery silników z Rys. 01.</text><text x="40.00" y="1020.00" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2701b" text-anchor="start" font-weight="400" dominant-baseline="middle">Uwaga: SIYI A8 mini i konwerter wideo SIYI mają fabrycznie ten sam adres 192.168.144.25 — przy dwóch źródłach obrazu zmień jeden adres.</text></svg>